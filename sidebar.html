<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STICK</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>STICK</h1>
      <p id="task">No task detected yet</p>
    </div>
    <span id="focus" class="chip" data-focus="idle">Idle</span>
  </header>

  <section class="companion-card" aria-label="Stick companion">
    <div id="sidebar-stick-stage" aria-hidden="true"></div>
    <div class="companion-copy">
      <strong>Stick is keeping an eye on your study.</strong>
      <span id="stick-message" aria-live="polite">Your tabs and saved work, together.</span>
    </div>
  </section>

  <nav class="seg" role="tablist">
    <button role="tab" aria-selected="true" data-view="groups">Tasks <span id="count-groups" class="badge">0</span></button>
    <button role="tab" aria-selected="false" data-view="activity">History <span id="count-activity" class="badge">0</span></button>
    <button role="tab" aria-selected="false" data-view="summaries">Summaries <span id="count-summaries" class="badge">0</span></button>
    <button role="tab" aria-selected="false" data-view="notes">Notes <span id="count-notes" class="badge">0</span></button>
  </nav>

  <main>
    <section id="view-groups" class="view"></section>
    <section id="view-activity" class="view" hidden></section>
    <section id="view-summaries" class="view" hidden></section>
    <section id="view-notes" class="view" hidden></section>
  </main>

  <footer id="dev" hidden>
    <span>Dev</span>
    <button id="dev-regroup">Regroup</button>
    <button id="dev-summary">+ Summary</button>
    <button id="dev-note">+ Note</button>
    <button id="dev-focus">Focus ▸</button>
  </footer>

  <script src="Stickman/stick-module/stick-module/stick.config.js"></script>
  <script src="Stickman/stick-module/stick-module/stick.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
